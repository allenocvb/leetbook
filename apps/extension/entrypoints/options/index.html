<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LeetBook Capture — Pairing</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #111111;
        background: #ffffff;
        max-width: 460px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 { font-size: 18px; font-weight: 600; }
      p { color: #666666; font-size: 13px; }
      label { display: block; font-size: 12px; color: #666666; margin: 14px 0 4px; }
      input {
        font: inherit;
        font-family: ui-monospace, Menlo, monospace;
        width: 100%;
        padding: 7px 10px;
        border: 1px solid #ebebea;
        border-radius: 6px;
        box-sizing: border-box;
      }
      button {
        font: inherit;
        margin-top: 16px;
        padding: 7px 14px;
        border-radius: 6px;
        border: none;
        background: #111111;
        color: #ffffff;
        cursor: pointer;
      }
      #status { margin-top: 12px; font-size: 13px; color: #666666; min-height: 18px; }
    </style>
  </head>
  <body>
    <h1>LeetBook Capture</h1>
    <p>
      Open the LeetBook desktop app → Settings &amp; Pairing, and copy the pairing token here.
    </p>
    <form id="pairing-form">
      <label for="token">Pairing token</label>
      <input id="token" name="token" placeholder="7F2K91QD" autocomplete="off" />
      <label for="port">Port</label>
      <input id="port" name="port" value="7749" inputmode="numeric" />
      <button type="submit">Save &amp; test connection</button>
    </form>
    <p id="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
