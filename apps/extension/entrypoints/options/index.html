<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LeetBook Capture — Pairing</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #111111;
        background: #ffffff;
        max-width: 460px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 { font-size: 18px; font-weight: 600; }
      p { color: #666666; font-size: 13px; }
      button {
        font: inherit;
        margin-top: 16px;
        padding: 7px 14px;
        border-radius: 6px;
        border: none;
        background: #111111;
        color: #ffffff;
        cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      #code {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 28px;
        letter-spacing: 0.18em;
        color: #111111;
        margin: 18px 0 0;
      }
      #code:empty { display: none; }
      #status { margin-top: 12px; font-size: 13px; color: #666666; min-height: 18px; }
      #status.paired { color: #1d7a4c; }
      #status.failed { color: #a63b4c; }
    </style>
  </head>
  <body>
    <h1>LeetBook Capture</h1>
    <p>
      Open the LeetBook desktop app, then connect below. LeetBook will ask you to approve
      this extension — there is no token to copy.
    </p>
    <button id="connect" type="button">Connect to LeetBook</button>
    <p id="code"></p>
    <p id="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
